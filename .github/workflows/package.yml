name: 打包 Beta APK

# Beta 测试包：push main 自动构建，或 Actions 页手动触发。发布正式版见 release.yml。
#
# 签名策略（重要）：Beta 不传签名密钥 → 构建 assembleDebug，复用 Gradle 的
# ~/.android/debug.keystore（AOSP debug key，SHA-256 21343357…dddf）。
# 这与历史 Beta 包（旧 CI 同样用 assembleDebug）签名一致，因此老用户可直接覆盖安装。
# 该 key 是公开的，任何人都能签出可覆盖安装的同包名包 —— 仅用于内测分发，不要对外当正式版。
# 需要真签名时，给下面 with 补上 keystore-b64 等参数即可切到 assembleRelease。
on:
  push:
    branches: [ "main" ]
    # 纯文档改动不触发构建，省 CI 额度
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 同一分支连续推送时取消旧任务，避免排队堆积
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 构建链路全部收敛在复合 action 内；APK 路径由 action 统一解析为 outputs.apk
      - name: 构建 Android 包
        id: build
        uses: ./.github/actions/android-release

      # 只做改名，不再拼接 APK 路径
      - name: 重命名 Beta 包
        run: |
          mkdir -p dist-apk
          cp "${{ steps.build.outputs.apk }}" \
             "dist-apk/QuizTrainer-${{ steps.build.outputs.version }}-beta.apk"

      - name: 上传 Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: QuizTrainer-Beta-${{ github.run_number }}
          path: dist-apk/QuizTrainer-*-beta.apk
          if-no-files-found: error
