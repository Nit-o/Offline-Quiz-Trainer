name: 打包 Beta APK

# Beta 测试包：push main 自动构建，或 Actions 页手动触发。
# 发布正式版见 release.yml（推 v* 标签）。
on:
  push:
    branches: [ "main" ]
    # 纯文档改动不触发构建，省 CI 额度
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 同一分支连续推送时取消旧任务，避免排队堆积
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 构建链路全部收敛在复合 action 内；APK 路径由 action 统一解析为 outputs.apk
      - name: 构建 Android 包
        id: build
        uses: ./.github/actions/android-release
        with:
          version-code: ${{ github.run_number }}
          keystore-b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 只做改名，不再拼接 APK 路径
      - name: 重命名 Beta 包
        run: |
          mkdir -p dist-apk
          SUFFIX=""
          [ "${{ steps.build.outputs.signed }}" = "true" ] || SUFFIX="-unsigned"
          cp "${{ steps.build.outputs.apk }}" \
             "dist-apk/QuizTrainer-${{ steps.build.outputs.version }}-beta${SUFFIX}.apk"

      - name: 上传 Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: QuizTrainer-Beta-${{ github.run_number }}
          path: dist-apk/QuizTrainer-*-beta*.apk
          if-no-files-found: error
