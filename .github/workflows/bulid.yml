name: 自动打包 Cordova APK

# 1. 触发条件：
#    - 推送代码到 main 分支 → 自动打包，APK 以 artifact 形式供你下载（测试用）
#    - 推送 v 开头的标签（如 v1.0.0）→ 自动打包并发布 GitHub Release
#    - 在 Actions 页面手动点 Run workflow → 手动打包
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的免费云电脑
    permissions:
      contents: write  # 允许创建 GitHub Release（只有打标签时才会用到）

    steps:
      # 2. 拉取你的代码
      - name: 拉取代码
        uses: actions/checkout@v7

      # 3. 安装 Node.js 环境 (Cordova 依赖它)
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 4. 安装 Java 环境 (Android 打包必须，小白直接复制版本号就行)
      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. 全局安装 Cordova 打包工具
      - name: 安装 Cordova
        run: npm install -g cordova

      # 6. 安装 android/ 目录下的依赖（Cordova 项目在 android/ 里，所有命令都要先进入该目录）
      - name: 安装依赖
        working-directory: android
        run: npm install

      # 7. 以仓库根目录的 index.html 和 vendor/ 为唯一数据源，同步到 android/www（避免手工复制导致 APK 里是旧页面）
      - name: 同步网页文件到 www
        working-directory: android
        run: |
          mkdir -p www
          cp ../index.html www/index.html
          rm -rf www/vendor
          cp -r ../vendor www/vendor

      # 8. 版本号自动同步：从 git 标签（如 v1.0.1）提取版本号，写入 config.xml 和 package.json（仅打标签时执行）
      - name: 安装 xmlstarlet
        run: sudo apt-get install -y xmlstarlet

      - name: 同步版本号
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # config.xml 的 <widget> 在默认命名空间 (http://www.w3.org/ns/widgets) 中，
          xmlstarlet ed -L -N w="http://www.w3.org/ns/widgets" -u "/w:widget/@version" -v "$VERSION" config.xml
          cat config.xml | grep -o 'version="[^"]*"' | head -1
          npm version "$VERSION" --no-git-tag-version

      # 9. 添加 Android 平台 (如果报错，可能是 node_modules 没装，上面已经自动补装)
      - name: 添加 Android 平台
        working-directory: android
        run: cordova platform add android --no-interactive

      # 10. 开始打包 (生成的是 Debug 版，不需要签名，直接就能装手机测试)
      - name: 打包成 APK
        working-directory: android
        run: cordova build android

      # 10.5 检查最终 APK 的权限列表（确认 edit-config 生效、没有多余权限）
      - name: 检查最终权限
        working-directory: android
        run: |
          echo "=== 最终 AndroidManifest 权限列表 ==="
          grep -E 'android:name="android.permission\.[A-Z_]+"' platforms/android/app/src/main/AndroidManifest.xml | sed 's/.*android:name="\([^"]*\)".*/\1/' | sort -u || echo "（无权限声明）"

      # 11. 将打包好的 APK 上传到网页，供你下载
      - name: 上传 APK 文件
        uses: actions/upload-artifact@v7
        with:
          name: 安装包-${{ github.ref_name }}
          path: android/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      # 12. 如果本次推送带 v 开头标签（如 v1.0.0），自动创建 Release 并把 APK 挂上去
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: android/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
