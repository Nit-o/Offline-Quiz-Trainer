name: 发布 Release APK

# 正式版：推送 v 开头标签（如 v1.0.0）→ 构建并发布 GitHub Release。
# 与 Beta 共用 .github/actions/android-release，避免两条流水线行为漂移。
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write # 创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.21.0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 正式版必须有签名密钥：缺了就立刻失败，避免产出无法覆盖安装的包
      - name: 校验签名凭据
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 secrets.ANDROID_KEYSTORE_B64 —— 正式包必须 release 签名，拒绝产出未签名包"
            exit 1
          fi

      # 提前归一化并校验标签（v1.2.3 → 1.2.3）：避免跑完 cap add android 才在 sync-version 处失败，
      # 同时保证 package.json / versionName / 产物文件名三处用同一个值
      - name: 解析版本标签
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::标签格式应为 v<major>.<minor>.<patch>，当前：$GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "版本：$V"

      - name: 构建 Android 包
        id: build
        uses: ./.github/actions/android-release
        with:
          version: ${{ env.VERSION }}
          version-code: ${{ github.run_number }}
          keystore-b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 重命名发布包
        run: |
          mkdir -p dist-apk
          cp "${{ steps.build.outputs.apk }}" "dist-apk/QuizTrainer-${VERSION}.apk"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-apk/QuizTrainer-*.apk
          generate_release_notes: true
