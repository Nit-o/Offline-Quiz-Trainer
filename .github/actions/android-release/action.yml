name: Android release 构建
description: >-
  Beta 与正式版共用的构建链路：依赖安装 → 本地插件 → dist → cap add android → 版本同步
  → 平台补丁 → 构建 → 产物门禁，并统一解析出 APK 路径（单一事实来源）。
  调用方只需消费 outputs.apk，不要自行拼接 android/app/build/outputs/... 路径。

inputs:
  version:
    description: 语义版本（如 1.2.3）。留空则沿用仓库 package.json 的 version（Beta 用）。
    required: false
    default: ""
  keystore-b64:
    description: >-
      release.keystore 的 base64。提供时走 assembleRelease + R8 + 该密钥签名（正式版）；
      留空时走 assembleDebug —— 复用 Gradle 的 ~/.android/debug.keystore（AOSP debug key），
      与历史 Beta 包签名一致，老用户可直接覆盖升级。
    required: false
    default: ""
  keystore-password:
    required: false
    default: ""
  key-alias:
    required: false
    default: ""
  key-password:
    required: false
    default: ""

outputs:
  apk:
    description: 构建产物的相对路径（已校验存在）
    value: ${{ steps.resolve.outputs.apk }}
  signed:
    description: 是否为带正式密钥的 release 包（'true' / 'false'）
    value: ${{ steps.resolve.outputs.signed }}
  version:
    description: 本次构建使用的语义版本
    value: ${{ steps.ver.outputs.version }}

runs:
  using: composite
  steps:
    # android/ 在 .gitignore 中，CI 每次都是从零生成，故所有原生改动必须能在补丁里复现
    - name: 安装依赖
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 构建本地插件
      shell: bash
      run: pnpm run build:plugin

    - name: 同步网页到 dist
      shell: bash
      run: pnpm run sync:web

    - name: 添加 Android 平台
      shell: bash
      run: pnpm run cap add android

    - name: 解析版本号
      id: ver
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V=$(node -p "require('./package.json').version"); fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "构建版本：$V"

    # 必须在 cap add android 之后（需要 android/app/build.gradle 存在）
    - name: 同步版本号到 build.gradle
      if: inputs.version != ''
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        CAP_VERSION_CODE: ${{ github.run_number }}
      run: node scripts/sync-version.cjs "$INPUT_VERSION"

    - name: 应用平台补丁
      shell: bash
      run: node scripts/patch-android.cjs

    # cap sync 会重新生成插件工程的 build.gradle，故补丁幂等重跑
    - name: 同步原生工程 + 重跑补丁
      shell: bash
      run: pnpm run cap sync android && node scripts/patch-android.cjs

    - name: 还原签名密钥
      shell: bash
      env:
        KS_B64: ${{ inputs.keystore-b64 }}
      run: |
        if [ -z "$KS_B64" ]; then
          echo "未提供签名密钥 → 走 assembleDebug，复用 Gradle debug keystore（与历史 Beta 包签名一致）"
          exit 0
        fi
        echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        {
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ inputs.keystore-password }}"
          echo "ANDROID_KEY_ALIAS=${{ inputs.key-alias }}"
          echo "ANDROID_KEY_PASSWORD=${{ inputs.key-password }}"
        } >> "$GITHUB_ENV"

    - name: 打包 APK
      shell: bash
      working-directory: android
      run: |
        # 有正式密钥 → release（R8 + 正式签名）；无密钥 → debug（沿用 AOSP debug key）
        if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
        echo "gradle $TASK"
        ./gradlew "$TASK"

    # 产物路径的唯一解析点：下游（重命名/上传/发布）只读 $APK / outputs.apk
    - name: 解析 APK 路径
      id: resolve
      shell: bash
      run: |
        REL_R=android/app/build/outputs/apk/release/app-release.apk
        REL_U=android/app/build/outputs/apk/release/app-release-unsigned.apk
        REL_D=android/app/build/outputs/apk/debug/app-debug.apk
        if [ -f "$REL_R" ]; then APK="$REL_R"; SIGNED=true
        elif [ -f "$REL_U" ]; then APK="$REL_U"; SIGNED=false
        elif [ -f "$REL_D" ]; then APK="$REL_D"; SIGNED=false
        else
          echo "::error::未找到 APK 产物"
          ls -la android/app/build/outputs/apk/*/ 2>/dev/null || true
          exit 1
        fi
        echo "apk=$APK" >> "$GITHUB_OUTPUT"
        echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
        echo "APK=$APK" >> "$GITHUB_ENV"
        echo "解析到产物：$APK（正式签名=$SIGNED）"

    # 门禁：敏感权限红线始终强制；debuggable / debug 证书仅在正式密钥签名时强制
    - name: 产物门禁
      shell: bash
      run: |
        if [ "${{ steps.resolve.outputs.signed }}" = "true" ]; then
          APKSIGNER_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          "$APKSIGNER_DIR/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signing.txt"
          cat "$RUNNER_TEMP/signing.txt"
          node scripts/verify-apk.cjs "$APK" "$RUNNER_TEMP/signing.txt"
        else
          # Beta：允许 debuggable 与 debug 证书（沿用旧签名），但仍校验无敏感权限。
          # 打印实际签名证书，便于核对是否仍与历史 Beta 包同源（期望 CN=Android Debug）。
          APKSIGNER_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER_DIR" ]; then
            echo "=== Beta 包签名证书（期望 CN=Android Debug，SHA-256 以 21343357 开头）==="
            "$APKSIGNER_DIR/apksigner" verify --print-certs "$APK" 2>&1 | sed -n '1,10p' || true
          fi
          node scripts/verify-apk.cjs "$APK" --allow-debuggable
        fi
