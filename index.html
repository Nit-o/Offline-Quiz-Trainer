<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f0ebe3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181a20" media="(prefers-color-scheme: dark)">
    <title>Offline-Quiz-Trainer</title>
    <style>
        /* ============================================================
           1. DESIGN TOKENS — oklch() perceptual colorspace (CSS Color L5)
           ============================================================ */
        :root {
            --primary:       oklch(0.48 0.12 160);
            --primary-light: oklch(0.58 0.10 160);
            --primary-dark:  oklch(0.35 0.09 160);
            --primary-glow:  oklch(0.48 0.12 160 / 0.22);
            --accent:        oklch(0.70 0.14 85);
            --accent-light:  oklch(0.78 0.12 85);
            --accent-dark:   oklch(0.58 0.13 80);
            --error:         oklch(0.52 0.20 25);
            --error-bg:      oklch(0.52 0.20 25 / 0.10);
            --success:       oklch(0.55 0.14 150);
            --success-bg:    oklch(0.55 0.14 150 / 0.10);
            --surface:       oklch(0.985 0.005 85);
            --surface-alt:   oklch(0.96 0.008 85);
            --bg:            oklch(0.94 0.008 85);
            --text:          oklch(0.22 0.02 80);
            --text-soft:     oklch(0.38 0.01 80);
            --text-muted:    oklch(0.52 0.01 80);
            --divider:       oklch(0.22 0.02 80 / 0.10);
            --shadow-sm:     0 1px 3px  oklch(0 0 0 / 0.06);
            --shadow-md:     0 4px 12px oklch(0 0 0 / 0.08);
            --shadow-lg:     0 8px 28px oklch(0 0 0 / 0.10);

            /* Foreground on colored buttons/badges (WCAG contrast).
               Light theme: white text on saturated primary/success/error. */
            --on-primary: #fff;
            --on-success: #fff;
            --on-error:   #fff;
            --on-accent:  oklch(0.22 0.02 80);

            /* Stroke + hairline tokens (kept off the rhythm grid on purpose). */
            --bw-1: 1px;
            --bw-2: 2px;
            --bw-3: 3px;

            /* Destructive-action gap (Fitts: ≥16px between adjacent destructive ops). */
            --gap-destructive: var(--sp-5);

            --text-base:  clamp(1rem,    0.9rem + 0.25vw,  1.125rem);
            --text-sm:    clamp(0.8125rem, 0.75rem + 0.15vw, 0.875rem);
            --text-xs:    clamp(0.6875rem, 0.65rem + 0.1vw,  0.75rem);
            --text-lg:    clamp(1.25rem,  1.1rem + 0.5vw,   1.5rem);
            --text-xl:    clamp(1.5rem,   1.3rem + 0.75vw,  2rem);
            --text-2xl:   clamp(2rem,     1.7rem + 1vw,     2.5rem);

            --font-serif: "Songti SC", "STKaiti", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
            --font-sans:  "PingFang SC", "SF Pro Text", system-ui, -apple-system, sans-serif;
            --font-mono:  "SF Mono", "Menlo", "Consolas", monospace;

            --sp-1:  0.125rem;
            --sp-2:  0.25rem;
            --sp-3:  0.5rem;
            --sp-4:  0.75rem;
            --sp-5:  1rem;
            --sp-6:  1.25rem;
            --sp-8:  1.5rem;
            --sp-10: 2rem;
            --sp-12: 2.5rem;

            --space-related:   var(--sp-3);
            --space-unrelated: var(--sp-5);
            --space-section:   var(--sp-8);

            --rhythm: 1.5rem;
            --lh-unit: 1lh;

            --radius:    6px;
            --radius-sm: 3px;
            --radius-lg: 10px;
            --radius-xl: 14px;

            --touch-min: 44px;
            --touch-min-lg: 48px;
            --ease:       cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out:   cubic-bezier(0, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top:    env(safe-area-inset-top, 0px);
            --measure: 66ch;
        }

        [data-theme="dark"] {
            --primary:       oklch(0.62 0.14 155);
            --primary-light: oklch(0.70 0.12 155);
            --primary-dark:  oklch(0.52 0.12 155);
            --primary-glow:  oklch(0.62 0.14 155 / 0.22);
            --accent:        oklch(0.74 0.14 85);
            --accent-light:  oklch(0.80 0.12 85);
            --accent-dark:   oklch(0.64 0.13 80);
            --error:         oklch(0.60 0.20 25);
            --error-bg:      oklch(0.60 0.20 25 / 0.12);
            --success:       oklch(0.62 0.14 150);
            --success-bg:    oklch(0.62 0.14 150 / 0.12);
            --surface:       oklch(0.22 0.015 250);
            --surface-alt:   oklch(0.18 0.012 250);
            --bg:            oklch(0.15 0.012 250);
            --text:          oklch(0.92 0.01 95);
            --text-soft:     oklch(0.72 0.01 95);
            --text-muted:    oklch(0.52 0.01 95);
            --divider:       oklch(0.92 0.01 95 / 0.10);
            --shadow-sm:     0 1px 3px  oklch(0 0 0 / 0.40);
            --shadow-md:     0 4px 12px oklch(0 0 0 / 0.50);
            --shadow-lg:     0 8px 28px oklch(0 0 0 / 0.60);
            /* Dark-on-light for AA contrast: primary/success/error are pale in dark mode. */
            --on-primary: oklch(0.16 0.02 155);
            --on-success: oklch(0.16 0.02 150);
            --on-error:   oklch(0.16 0.02 25);
            --on-accent:  oklch(0.16 0.02 80);
        }

        [data-theme="oled"] {
            --primary:       oklch(0.62 0.14 155);
            --primary-light: oklch(0.70 0.12 155);
            --primary-glow:  oklch(0.62 0.14 155 / 0.18);
            --accent:        oklch(0.74 0.14 85);
            --accent-light:  oklch(0.80 0.12 85);
            --error:         oklch(0.60 0.20 25);
            --error-bg:      oklch(0.60 0.20 25 / 0.10);
            --success:       oklch(0.62 0.14 150);
            --success-bg:    oklch(0.62 0.14 150 / 0.10);
            --surface:       oklch(0 0 0);
            --surface-alt:   oklch(0.05 0 0);
            --bg:            oklch(0 0 0);
            --text:          oklch(0.90 0.01 95); /* softened from 0.96 to reduce glare vs pure black */
            --text-soft:     oklch(0.72 0.01 95);
            --text-muted:    oklch(0.52 0.01 95);
            --divider:       oklch(1 0 0 / 0.08);
            --shadow-sm:     0 1px 2px  oklch(0 0 0 / 0.30);
            --shadow-md:     0 2px 6px  oklch(0 0 0 / 0.40);
            --shadow-lg:     0 4px 12px oklch(0 0 0 / 0.50);
            --on-primary: oklch(0.16 0.02 155);
            --on-success: oklch(0.16 0.02 150);
            --on-error:   oklch(0.16 0.02 25);
            --on-accent:  oklch(0.16 0.02 80);
        }

        @keyframes fadeSlideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeIn       { from { opacity:0; } to { opacity:1; } }
        @keyframes scaleIn      { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
        @keyframes pulse        { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        @keyframes badgePop     { 0% { transform:scale(0); } 70% { transform:scale(1.15); } 100% { transform:scale(1); } }
        @keyframes fabEnter     { from { opacity:0; transform:scale(0) translateY(60px); } to { opacity:1; transform:scale(1) translateY(0); } }

        :where(*, *::before, *::after) { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            -webkit-tap-highlight-color: transparent;
            text-size-adjust: none;
            scrollbar-color: var(--text-muted) transparent;
            scrollbar-width: thin;
        }

        body {
            font-family: var(--font-sans);
            font-size: var(--text-base);
            background: var(--bg);
            color: var(--text);
            line-height: var(--rhythm);
            letter-spacing: 0.01em;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            transition: background-color .4s var(--ease);
            overscroll-behavior: contain;
            touch-action: pan-y pinch-zoom;
        }

        /* Vertical rhythm (Bringhurst): block spacing aligned to --rhythm grid.
           The line-height == --rhythm; all major vertical margins are integer multiples. */
        h1, h2, h3, h4 { text-wrap: balance; font-family: var(--font-serif); overflow-wrap: break-word; }
        h1 { margin-block: calc(var(--rhythm) * 2) var(--rhythm); }
        h2 { margin-block: calc(var(--rhythm) * 2) var(--rhythm); }
        h3 { margin-block: var(--rhythm) calc(var(--rhythm) * 0.5); }
        p, li, .question-title, .explanation-content, .wrong-card-explanation { text-wrap: pretty; max-width: var(--measure); }
        /* Ident consecutive paragraphs (1lh — defined but kept off by default for UI text). */
        article p + p { text-indent: var(--lh-unit); }

        /* Visually-hidden (a11y) */
        .visually-hidden {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
        }

        /* Skip-link — keyboard a11y */
        .skip-link {
            position: fixed; top: var(--sp-2); left: var(--sp-2); z-index: 999;
            background: var(--primary); color: var(--on-primary); padding: var(--sp-3) var(--sp-5);
            border-radius: var(--radius-lg); font-weight: 600; font-size: var(--text-sm);
            text-decoration: none; transform: translateY(-200%); transition: transform .2s var(--ease);
        }
        .skip-link:focus-visible { transform: translateY(0); outline: 2px solid var(--primary); outline-offset: 2px; }

        /* SVG icon system — SVG 2.0. .icon scales with font-size; .icon-sm for inline badges. */
        .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .icon, .icon-sm {
            display: inline-block; vertical-align: -0.15em; fill: none;
            stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .icon    { width: 1.1em; height: 1.1em; }
        .icon-sm { width: 1em; height: 1em; }

        /* Skeleton screen — async parse feedback (Nielsen “system state visible”) */
        .skeleton {
            background: linear-gradient(90deg, var(--surface-alt) 25%, var(--divider) 37%, var(--surface-alt) 63%);
            background-size: 400% 100%; animation: skeletonShimmer 1.4s var(--ease) infinite;
            border-radius: var(--radius); color: transparent !important;
        }
        @keyframes skeletonShimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        .skeleton-option { height: 48px; margin-block-end: var(--space-related); border-radius: var(--radius-lg); }
        .skeleton-title  { height: 1.5rem; width: 70%; margin-block-end: var(--sp-4); border-radius: var(--radius); }

        /* Figure / figcaption — code & formula context anchors (Cognitive Load Theory) */
        figure.code-figure { margin: var(--sp-4) 0; border: 1px solid var(--divider); border-radius: var(--radius); overflow: hidden; }
        figure.code-figure pre { margin: 0; padding: var(--sp-4); background: var(--surface-alt); overflow-x: auto; }
        figure.code-figure figcaption {
            padding: var(--sp-2) var(--sp-4); font-size: var(--text-xs);
            color: var(--text-muted); background: var(--surface); border-block-end: 1px solid var(--divider);
        }

        .container {
            max-width: 860px;
            margin-inline: auto;
            padding: var(--sp-6);
            padding-bottom: calc(var(--sp-6) + var(--safe-bottom));
            animation: fadeSlideUp .5s var(--ease-out);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-block-end: var(--space-section);
            padding-block-end: var(--sp-5);
            border-block-end: 2px solid var(--divider);

            & .header-left {
                display: flex;
                flex-direction: column;
                gap: var(--sp-1);

                & h1 { color: var(--primary); letter-spacing: .02em; }
                & .subtitle { font-size: var(--text-sm); color: var(--text-soft); }
            }
        }

        /* ============================================================
           CARD
           ============================================================ */
        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            margin-block-end: var(--sp-6);
            overflow: clip;
            border: var(--bw-1) solid var(--divider);
            transition: border-color .3s var(--ease);

            &:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        }

        .card-title {
            font-family: var(--font-serif);
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text);
            padding: var(--sp-5) var(--sp-6) var(--sp-4);
            border-bottom: var(--bw-1) solid var(--divider);
            letter-spacing: .02em;
            display: flex;
            align-items: center;
            gap: var(--space-related);

            & .card-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: var(--radius);
                background: var(--surface-alt);
                font-size: var(--text-base);
                flex-shrink: 0;
                color: var(--primary);
            }
        }

        .card-content { padding: var(--sp-6); }

        .hidden { display: none !important; }

        /* ============================================================
           COLLAPSIBLE — native <details>/<summary> (Progressive Disclosure).
           No JS required for toggle; ESC/Enter/Space handled natively.
           ============================================================ */
        details.card.collapsible > summary.card-title {
            cursor: pointer; user-select: none; list-style: none;
            &::-webkit-details-marker { display: none; }
            &::after {
                content: "▾"; margin-left: auto;
                font-size: var(--text-xs); color: var(--text-muted);
                transition: transform .25s var(--ease);
            }
        }
        details.card.collapsible:not([open]) > summary.card-title::after { transform: rotate(-90deg); }
        details.card.collapsible > summary.card-title:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

        /* ============================================================
           UNIFIED MENU PANEL
           ============================================================ */
        /* details disclosure toggles display natively; no max-height animation needed. */
        .menu-panel.collapsible > .card-content { background: transparent; }

        /* Multi-column layout (Gestalt proximity + Grid L2):
           File spans full width; theme & settings share a row ≥720px.
           Separation via flex/grid gap keeps entropy low (no per-item borders). */
        .menu-panel .card-content {
            display: flex;
            flex-direction: column;
            gap: var(--space-unrelated);
        }
        .menu-panel .menu-group { display: flex; flex-direction: column; gap: var(--space-related); }
        @media (min-width: 720px) {
            .menu-panel .card-content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-areas: "file file" "theme settings";
                gap: var(--sp-6) var(--sp-8);
            }
            .menu-panel .menu-group--file     { grid-area: file; }
            .menu-panel .menu-group--theme    { grid-area: theme; }
            .menu-panel .menu-group--settings { grid-area: settings; }
        }
        .menu-panel .menu-group-title {
            font-family: var(--font-sans);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .menu-panel .menu-group-content { display: flex; flex-direction: column; gap: var(--space-related); }
        .menu-panel .menu-row {
            display: flex;
            align-items: center;
            gap: var(--space-related);
            flex-wrap: wrap;
            &:has(input:checked) label { color: var(--primary); }
            & label { cursor: pointer; user-select: none; font-size: var(--text-sm); color: var(--text); }
            & input[type="number"] {
                width: 72px; padding: var(--sp-1) var(--sp-2);
                border: var(--bw-1) solid var(--divider); border-radius: var(--radius);
                background: var(--surface); color: var(--text);
                font-size: var(--text-sm); font-family: var(--font-sans);
                &:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
            }
            & input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
        }
        .menu-row-hint { font-size: var(--text-xs); color: var(--text-muted); flex-basis: 100%; }
        /* File dropzone — semantic <label> wraps <input>; auto-loads on change.
           Fitts: large hit target; dashed border signals affordance (Closure). */
        .file-drop {
            display: flex;
            align-items: center;
            gap: var(--sp-4);
            padding: var(--sp-4) var(--sp-5);
            background: var(--surface-alt);
            border: var(--bw-2) dashed color-mix(in oklch, var(--text-muted) 38%, transparent);
            border-radius: var(--radius-lg);
            cursor: pointer;
            min-height: var(--touch-min-lg);
            user-select: none;
            transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease), transform .15s var(--ease);
            &:hover { border-color: var(--primary-light); background: var(--primary-glow); }
            &:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
            &.dragover { border-color: var(--primary); background: var(--primary-glow); transform: scale(1.01); }
            &[aria-busy="true"] { pointer-events: none; opacity: 0.65; }
        }
        .file-drop-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--primary-glow); color: var(--primary);
            font-size: 1.25rem; flex-shrink: 0;
        }
        .file-drop-text { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
        .file-drop-title { font-weight: 600; font-size: var(--text-sm); color: var(--text); }
        .file-drop-hint  { font-size: var(--text-xs); color: var(--text-muted); }

        /* Theme selector — ARIA radiogroup; arrow-key navigation handled in JS. */
        .theme-selector {
            display: flex;
            gap: var(--space-related);
            & .theme-option {
                background: var(--surface);
                border: var(--bw-2) solid var(--divider);
                border-radius: var(--radius-lg);
                padding: var(--sp-2) var(--sp-4);
                cursor: pointer;
                font: 500 var(--text-sm) var(--font-sans);
                color: var(--text-soft);
                min-height: var(--touch-min);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--sp-1);
                user-select: none;
                transition: border-color .15s var(--ease), background .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease);
                flex: 1;
                &:hover { border-color: var(--primary-light); color: var(--text); }
                &:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
                &.selected {
                    border-color: var(--primary);
                    background: var(--primary-glow);
                    color: var(--primary);
                    font-weight: 600;
                    box-shadow: 0 0 0 1px var(--primary);
                }
            }
        }

        /* ============================================================
           BUTTON SYSTEM
           ============================================================ */
        .btn {
            background: var(--primary); border: none; border-radius: var(--radius-lg); color: var(--on-primary);
            padding: var(--sp-4) var(--sp-6); font: 600 var(--text-sm) var(--font-sans); cursor: pointer;
            min-height: var(--touch-min); display: inline-flex; align-items: center; justify-content: center;
            gap: var(--space-related); user-select: none; position: relative; overflow: hidden;
            transition: transform .12s var(--ease-out), background .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease);
            letter-spacing: .02em;

            &::after { content: ""; position: absolute; inset: 0; background: oklch(1 0 0 / 0); transition: background .2s var(--ease); }
            &:active { transform: scale(.97); &::after { background: oklch(0 0 0 / 0.12); } }
            &:hover { box-shadow: 0 2px 8px var(--primary-glow); }
            &:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
            &:disabled { background: var(--text-muted); color: var(--on-primary); cursor: not-allowed; box-shadow: none; &:active { transform: none; } }

            &.btn-outline { background: transparent; border: var(--bw-1) solid var(--divider); color: var(--text); &:hover { border-color: var(--primary); color: var(--primary); } }
            &.btn-ghost { background: transparent; color: var(--text-soft); &:hover { background: var(--surface-alt); color: var(--text); } }
            &.btn-accent { background: var(--accent); color: var(--on-accent); &:hover { box-shadow: 0 2px 8px oklch(0.70 0.14 85 / 0.35); } }
            &.btn-active { background: var(--primary-glow); border: var(--bw-1) solid var(--primary); color: var(--primary); font-weight: 600; }
            &.btn-sm { padding: var(--sp-2) var(--sp-4); font-size: var(--text-xs); min-height: 36px; }
        }
        .btn-text { white-space: nowrap; }

        /* ============================================================
           MODE SELECTION
           ============================================================ */
        .mode-selection { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-related); margin: var(--sp-1) 0 var(--sp-5); }

        .mode-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: var(--sp-8) var(--sp-5);
            text-align: center; cursor: pointer; border: var(--bw-2) solid var(--divider); box-shadow: var(--shadow-sm);
            transition: border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
            user-select: none; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);

            &:hover { border-color: var(--primary-light); box-shadow: 0 2px 8px var(--primary-glow); }
            &:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
            &.selected { border-color: var(--primary); background: var(--primary-glow); box-shadow: 0 0 0 3px var(--primary-glow); }
            & .mode-label { font-weight: 600; font-size: var(--text-base); color: var(--text); }
            & .mode-desc { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.4; max-width: 180px; }
        }

        /* ============================================================
           QUIZ SECTION — compact info bar + centered content
           ============================================================ */
        .quiz-area {
            /* center the quiz section horizontally */
            display: flex;
            justify-content: center;
        }

        #quizSection {
            width: 100%;
            max-width: var(--measure);
        }

        /* Compact info bar: timer + stats + progress in one row */
        .quiz-info-bar {
            display: flex;
            align-items: center;
            gap: var(--sp-5);
            margin-block-end: var(--sp-4);
            font-size: var(--text-xs);
            color: var(--text-soft);
            flex-wrap: wrap;
            font-variant-numeric: tabular-nums;

            & .quiz-info-group {
                display: flex;
                align-items: center;
                gap: var(--sp-3);
            }

            & .quiz-info-item {
                display: flex;
                align-items: center;
                gap: var(--sp-1);
                white-space: nowrap;

                & .stat-correct    { color: var(--success); font-weight: 600; }
                & .stat-incorrect  { color: var(--error);   font-weight: 600; }
                & .stat-unanswered { color: var(--text-muted); font-weight: 600; }
            }

            & .quiz-info-sep { color: var(--divider); user-select: none; }
        }

        /* Progress bar: thin, under info bar */
        .quiz-progress-wrap {
            margin-block-end: var(--sp-4);
            display: flex;
            align-items: center;
            gap: var(--space-related);

            & .progress {
                flex: 1;
                height: 4px;
                background: var(--divider);
                border-radius: 2px;
                overflow: hidden;

                & .progress-bar {
                    height: 100%;
                    background: var(--primary);
                    border-radius: 2px;
                    transition: width .4s var(--ease-out);
                }
            }

            & .q-counter {
                font-size: var(--text-xs);
                color: var(--text-muted);
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }

            & .q-mark-badge {
                font-size: 0.625rem;
                padding: 1px 8px;
                border-radius: 999px;
                background: var(--accent);
                color: var(--text);
                font-weight: 600;
                animation: badgePop .3s var(--ease-bounce);
                white-space: nowrap;
            }
        }

        /* Question content — centered via max-width */
        .question-title {
            font-size: var(--text-base);
            font-weight: 500;
            margin-block-end: var(--sp-5);
            color: var(--text);
            line-height: 1.7;

            & small {
                font-size: var(--text-xs);
                color: var(--text-muted);
                font-weight: 400;
                background: var(--surface-alt);
                padding: 1px 8px;
                border-radius: var(--radius-sm);
                margin-left: var(--space-related);
            }
        }

        .options { display: flex; flex-direction: column; gap: var(--space-related); margin-block-end: var(--sp-5); }

        .option {
            background: var(--surface); border: var(--bw-2) solid var(--divider); border-radius: var(--radius-lg);
            padding: 14px var(--sp-5); cursor: pointer; display: flex; align-items: center; gap: var(--sp-4);
            transition: border-color .15s var(--ease), background .15s var(--ease), transform .12s var(--ease-out), box-shadow .15s var(--ease);
            user-select: none; min-height: 48px; position: relative;

            &:active { transform: scale(.985); border-color: var(--primary); }
            &::before {
                content: ""; display: inline-flex; align-items: center; justify-content: center;
                width: 22px; height: 22px; border-radius: 50%; border: var(--bw-2) solid var(--divider);
                flex-shrink: 0; font-size: var(--text-xs); font-weight: 700; color: var(--text-muted);
                transition: border-color .15s var(--ease), background .15s var(--ease);
            }
            &:hover { border-color: var(--primary-light); background: var(--surface-alt); &::before { border-color: var(--primary-light); } }
            &:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
            &.selected { border-color: var(--primary); background: var(--primary-glow); &::before { background: var(--primary); border-color: var(--primary); } }
            &.correct { border-color: var(--success); background: var(--success-bg); &::before { background: var(--success); border-color: var(--success); } }
            &.incorrect { border-color: var(--error); background: var(--error-bg); &::before { background: var(--error); border-color: var(--error); } }
            &.disabled { pointer-events: none; opacity: .65; }
        }

        /* Multi-submit: sticky so it's never hidden on mobile */
        .multi-submit-bar {
            position: sticky;
            bottom: 0;
            display: flex;
            justify-content: flex-end;
            padding: var(--sp-2) 0;
            margin-block-start: var(--space-related);
            background: var(--surface);
            z-index: 2;
            border-top: 1px solid var(--divider);
        }

        /* ============================================================
           FEEDBACK
           ============================================================ */
        .answer-feedback {
            margin-block-start: var(--sp-5);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: var(--bw-1) solid var(--divider);
            animation: scaleIn .2s var(--ease);
            @starting-style { opacity: 0; transform: translateY(8px); }
            transition: opacity .2s var(--ease), transform .2s var(--ease);

            &.correct .answer-feedback-header { background: var(--success); color: var(--on-success); padding: var(--sp-4) var(--sp-5); font-weight: 600; font-size: var(--text-sm); display: flex; align-items: center; gap: var(--sp-2); }
            &.incorrect .answer-feedback-header { background: var(--error); color: var(--on-error); padding: var(--sp-4) var(--sp-5); font-weight: 600; font-size: var(--text-sm); display: flex; align-items: center; gap: var(--sp-2); }
            & .answer-feedback-content { padding: var(--sp-5); background: var(--surface); color: var(--text); font-size: var(--text-sm); }
        }

        .explanation-content {
            margin-block-start: var(--sp-4);
            padding: var(--sp-4) var(--sp-5);
            background: var(--surface-alt);
            border-left: var(--bw-3) solid var(--primary);
            border-radius: var(--radius);
            font-size: var(--text-sm);
            line-height: 1.7;
            color: var(--text-soft);
        }

        /* ============================================================
           CONTROLS — toolbar with two semantic regions
           Fitts: bottom-anchored; primary nav on the traversing edge.
           Gestalt: related grouped tight (Similarity), regions separated
           by a divider (Continuity). Submit lives in the nav overlay
           (Progressive Disclosure) — navSubmitBtn is the sole entry.
           ============================================================ */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-related);
            flex-wrap: wrap;
            margin-block-start: var(--sp-6);
            padding-block-start: var(--sp-5);
            border-block-start: 1px solid var(--divider);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: var(--space-related);
            flex-wrap: wrap;
            min-width: 0;
        }
        .controls-group--nav  { flex: 1 1 auto; justify-content: flex-start; }
        .controls-group--ctx  { justify-content: flex-end; }
        /* Destructive adjacent ops (Fitts ≥16px). Currently the mark/master buttons
           and restart/review/export — both pairs benefit from a wider safety gap. */
        .controls-group--destructive { gap: var(--gap-destructive); }

        /* ============================================================
           FLOATING NAVIGATION
           ============================================================ */
        .nav-fab {
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            bottom: max(80px, calc(var(--safe-bottom) + 80px));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: var(--on-primary);
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: transform .15s var(--ease-out), box-shadow .2s var(--ease);
            animation: fabEnter .4s var(--ease-out) both;
            -webkit-tap-highlight-color: transparent;
            @starting-style { opacity: 0; transform: scale(0.5); }

            &:active { transform: scale(.92); }
            &:hover { box-shadow: 0 6px 20px var(--primary-glow); }
            &:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
        }

        /* Native <dialog> — top layer + native focus trap + ESC.
           Tell UA to use the full viewport so we can center .nav-overlay-panel via flex. */
        dialog.nav-overlay {
            border: none; background: none; padding: 0;
            position: fixed; inset: 0;
            width: 100%; height: 100%; max-width: 100%; max-height: 100%;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
            &::backdrop { background: oklch(0 0 0 / 0.45); animation: fadeIn .15s var(--ease-out); }
        }
        /* Fallback for browsers that don't fully support showModal() — hide by default. */
        dialog.nav-overlay:not([open]) { display: none !important; }
        dialog.nav-overlay[open] { display: flex; }
        dialog.nav-overlay[open] .nav-overlay-panel { animation: scaleIn .15s var(--ease-out); }
        /* When closed, dialog is display:none via UA; no .hidden class needed. */

        .nav-overlay-panel {
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: var(--sp-5);
            max-width: min(400px, calc(100vw - 32px));
            max-height: min(70vh, 500px);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .nav-overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-block-end: var(--sp-4);
            padding-block-end: var(--sp-3);
            border-block-end: 1px solid var(--divider);

            & .nav-overlay-title {
                font-family: var(--font-sans);
                font-size: var(--text-sm);
                font-weight: 600;
                color: var(--text);
            }

            & .nav-overlay-close {
                background: none;
                border: none;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.1rem;
                color: var(--text-soft);
                transition: background .15s var(--ease), color .15s var(--ease);

                &:hover { background: var(--surface-alt); color: var(--text); }
                &:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
            }
        }

        .nav-overlay-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 6px;
            padding: var(--sp-1);
            overflow-y: auto;
            flex: 1;
        }

        /* Submit region — the sole submit entry (progressive disclosure).
           Accent treatment signals the primary terminal action. */
        .nav-overlay-submit {
            margin-block-start: var(--sp-4);
            padding-block-start: var(--sp-3);
            border-block-start: 1px solid var(--divider);
            display: flex;
            justify-content: center;
        }
        .nav-overlay-submit .btn { flex: 1; }

        .nav-fab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--text);
            font-size: 0.625rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px oklch(0 0 0 / 0.3);
        }

        /* Question nav buttons inside overlay — plain <button>, no tab semantic */
        .question-nav-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: var(--bw-1) solid var(--divider);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-soft);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 500;
            transition: border-color .15s var(--ease), background .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease), opacity .15s var(--ease);
            user-select: none;
            position: relative;

            &:hover { border-color: var(--primary-light); color: var(--primary); }
            &:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
            &.current { background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: 0 1px 4px var(--primary-glow); }
            &.answered   { background: var(--success); color: var(--on-success); border-color: var(--success); }
            &.error-answered { background: var(--error); color: var(--on-error); border-color: var(--error); }
            &.marked     { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
            &.marked.current { box-shadow: 0 0 0 3px var(--accent); }
            &.mastered { opacity: 0.5; text-decoration: line-through; background: var(--surface-alt); color: var(--text-muted); border-color: var(--divider); }
            &.mastered.current { opacity: 1; text-decoration: none; }
            &.mastered.marked { opacity: 1; text-decoration: line-through; }
        }

        /* ============================================================
           TOUCH SWIPE
           ============================================================ */
        .touch-swipe-zone { touch-action: pan-y; user-select: none; position: relative; overflow: hidden; }
        .touch-swipe-zone.swiping { touch-action: none; cursor: grabbing; }

        .swipe-indicator {
            position: absolute; top: 0; bottom: 0; width: 48px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity .15s var(--ease); pointer-events: none;
            z-index: 2; font-size: 1.5rem; color: var(--text-muted);
        }
        .swipe-indicator.left  { left: 0;  background: linear-gradient(to right,  var(--surface-alt), transparent); }
        .swipe-indicator.right { right: 0; background: linear-gradient(to left, var(--surface-alt), transparent); }
        .swipe-indicator.active { opacity: 1; }
        .swipe-indicator.active.reach { color: var(--primary); font-weight: bold; transform: scale(1.3); }

        .question-slide-wrap { transition: transform .12s var(--ease-out); }
        .question-slide-wrap.sliding-left  { transform: translateX(-16%); }
        .question-slide-wrap.sliding-right { transform: translateX(16%); }

        /* ============================================================
           RESULT
           ============================================================ */
        .score-display { text-align: center; padding: var(--sp-8) 0; }
        .score { font-family: var(--font-serif); font-size: var(--text-2xl); font-weight: 700; color: var(--primary); line-height: 1.2; }
        .score-label { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--sp-1); }

        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-related); margin: var(--sp-6) 0; }
        .result-stat { text-align: center; padding: var(--sp-4); border-radius: var(--radius-lg); background: var(--surface-alt); }
        .result-stat .stat-value { font-size: var(--text-lg); font-weight: 700; line-height: 1.2; }
        .result-stat .stat-label { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--sp-1); }
        .result-stat.correct    .stat-value { color: var(--success); }
        .result-stat.incorrect  .stat-value { color: var(--error); }
        .result-stat.unanswered .stat-value { color: var(--text-muted); }

        .result-msg { font-size: var(--text-sm); color: var(--text-soft); margin: var(--sp-5) 0; font-style: italic; }
        .result-time { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--sp-5); text-align: center; }
        .result-actions { display: flex; gap: var(--gap-destructive); flex-wrap: wrap; justify-content: center; margin-top: var(--sp-5); }

        .history-item { padding: var(--sp-2) 0; border-bottom: 1px solid var(--divider); color: var(--text-soft); font-size: var(--text-sm); display: flex; justify-content: space-between; gap: var(--sp-4); }
        .history-heading { font-family: var(--font-serif); font-size: var(--text-sm); color: var(--text-soft); margin-bottom: var(--space-related); }

        .file-status { color: var(--text-soft); margin: var(--sp-2) 0; font-size: var(--text-sm); }

        #fileList ul { list-style: none; padding: 0; margin: var(--sp-2) 0; }
        #fileList li { padding: var(--sp-1) var(--sp-2); color: var(--text-soft); font-size: var(--text-xs); background: var(--surface-alt); border-radius: var(--radius-sm); display: inline-block; margin: 2px var(--sp-1) 2px 0; }

        /* --- Snackbar --- */
        .snackbar {
            position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%;
            transform: translateX(-50%) translateY(8px); background: var(--text); color: var(--bg);
            padding: var(--sp-2) var(--sp-5); border-radius: var(--radius-lg); z-index: 300;
            opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease);
            pointer-events: none; font-size: var(--text-sm); font-weight: 500;
            box-shadow: var(--shadow-lg); max-width: 90vw; text-align: center;
            @starting-style { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }
        .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .snackbar.error { background: var(--error); color: var(--on-error); }

        /* --- Export --- */
        #exportPanel textarea {
            width: 100%; padding: var(--sp-4); border: 1px solid var(--divider); border-radius: var(--radius);
            background: var(--surface); color: var(--text); font-family: var(--font-mono);
            font-size: var(--text-xs); resize: vertical; margin-bottom: var(--sp-2); line-height: 1.6;
            &:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        }
        .export-actions { display: flex; gap: var(--gap-destructive); }
        .export-panel { margin-top: var(--sp-5); }
        .history-panel { margin-top: var(--sp-8); }

        /* --- Wrong cards --- */
        .wrong-card {
            background: var(--surface); border: var(--bw-1) solid var(--divider); border-radius: var(--radius-lg);
            padding: var(--sp-5); margin-bottom: var(--sp-4);
            transition: border-color .2s var(--ease);
            &:hover { border-color: var(--primary-light); }
        }
        .wrong-card-header { font-weight: 600; font-size: var(--text-sm); color: var(--primary); margin-bottom: var(--space-related); display: flex; align-items: center; gap: var(--space-related); }
        .wrong-card-header .badge { background: var(--error); color: var(--on-error); font-size: var(--text-xs); padding: var(--bw-1) var(--sp-2); border-radius: 999px; font-weight: 600; }
        .wrong-card-title { font-weight: 500; margin-bottom: .5rem; line-height: 1.6; }
        .wrong-card-options { margin-bottom: .5rem; padding-left: .5rem; border-left: 2px solid var(--divider); }
        .wrong-card-option { display: block; padding: 2px 0; font-size: var(--text-sm); color: var(--text-soft); }
        .wrong-card-option.correct-answer { color: var(--success); font-weight: 500; }
        .wrong-card-answer-row { display: flex; gap: var(--sp-6); flex-wrap: wrap; margin: var(--sp-2) 0; font-size: var(--text-sm); }
        .wrong-card-user-ans    { color: var(--error);   font-weight: 500; }
        .wrong-card-correct-ans { color: var(--success); font-weight: 500; }
        .wrong-card-explanation { margin-top: var(--sp-2); padding: var(--sp-2) var(--sp-4); background: var(--surface-alt); border-left: 3px solid var(--primary); border-radius: var(--radius); font-size: var(--text-sm); color: var(--text-soft); line-height: 1.6; }
        .wrong-summary       { color: var(--text-soft); margin-bottom: 1rem; }
        .wrong-all-correct   { padding: 2rem; text-align: center; color: var(--success); font-weight: 600; }
        .wrong-section-title { font-weight: 600; margin-bottom: 1rem; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .container { padding: var(--sp-4); }
            .mode-selection { grid-template-columns: 1fr; gap: var(--sp-2); }
            .mode-card { padding: var(--sp-5); min-height: 56px; flex-direction: row; justify-content: flex-start; gap: var(--sp-4); }
            .mode-card .mode-desc { max-width: none; text-align: left; }
            /* On phones, traversal is via swipe; hiding prev/next frees the bar.
               Fixed the previous selector typo (#prevtBtn → #prevBtn) which had
               left #prevBtn visible and broken the intended mobile layout. */
            #prevBtn, #nextBtn { display: none; }
            .controls {
                position: sticky; bottom: 0;
                background: var(--surface);
                padding: var(--sp-3); z-index: 10;
                border-block-start: 1px solid var(--divider);
                box-shadow: 0 -2px 8px oklch(0 0 0 / 0.06);
                justify-content: center;
            }
            .controls-group--nav { display: none; }
            .controls-group--ctx { flex: 1 1 auto; justify-content: stretch; gap: var(--sp-2); }
            .controls-group--ctx .btn { flex: 1; justify-content: center; min-height: var(--touch-min-lg); padding: var(--sp-2) var(--sp-3); }
            .option { padding: 14px var(--sp-4); min-height: 50px; }
            .btn { min-height: 42px; }
            .card-title { font-size: var(--text-base); padding: var(--sp-4) var(--sp-5); }
            .header h1 { font-size: var(--text-lg); }
            .result-grid { gap: var(--sp-2); }
            .result-stat { padding: var(--sp-2); }
            .result-stat .stat-value { font-size: var(--text-base); }
            .card-content { padding: var(--sp-5); }
            .nav-fab { width: 48px; height: 48px; font-size: 1.2rem; bottom: max(64px, calc(var(--safe-bottom) + 64px)); }
            .question-nav-btn { width: 40px; height: 40px; font-size: var(--text-sm); }
        }

        @media (max-width: 400px) {
            .option { padding: 12px var(--sp-2); min-height: 46px; font-size: var(--text-sm); }
            .controls-group--ctx .btn { font-size: var(--text-sm); }
            .score { font-size: var(--text-xl); }
            .nav-fab { width: 44px; height: 44px; font-size: 1.1rem; }
            .question-nav-btn { width: 38px; height: 38px; font-size: var(--text-xs); }
        }

        @media (min-width: 601px) and (max-width: 1024px) {
            .container { max-width: 860px; padding: var(--sp-8); }
        }

        @media (prefers-reduced-motion: reduce) {
            :where(*, *::before, *::after) {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<!-- SVG icon sprite — SVG 2.0 <use> + <symbol> with inline <title> (a11y).
     Icons referenced via <use href="#icon-*"/>. Decorative use sets aria-hidden. -->
<svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
