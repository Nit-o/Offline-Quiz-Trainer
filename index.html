<script type="module">
'use strict';

/* ===== EventBus ===== */
class EventBus {
    #listeners = new Map();
    on(event, cb) { if (!this.#listeners.has(event)) this.#listeners.set(event, new Set()); this.#listeners.get(event).add(cb); return () => this.off(event, cb); }
    off(event, cb) { const s = this.#listeners.get(event); if (s) { s.delete(cb); if (!s.size) this.#listeners.delete(event); } }
    emit(event, ...args) { const s = this.#listeners.get(event); if (s) [...s].forEach(cb => { try { cb(...args); } catch (e) { console.error(`[EventBus] "${event}":`, e); } }); }
}

/* ===== Utilities ===== */
const esc = str => str == null ? "" : String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[m]);
const fmtTime = ms => { const sec = Math.floor(ms / 1000); return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; };
const hashStr = s => { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return String(h); };

/* ===== Markdown Parser — code blocks wrapped in <figure> + <figcaption> (CLT context anchor) ===== */
class MarkdownParser {
    static parse(text) {
        if (!text) return "";
        return text
            .replace(/```([\s\S]*?)```/g, (_, c) => `<figure class="code-figure"><figcaption>代码</figcaption><pre><code>${esc(c)}</code></pre></figure>`)
            .replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
            .replace(/\*\*(.+?)\*\*/g, (_, t) => `<strong>${esc(t)}</strong>`)
            .replace(/\*(.+?)\*/g, (_, t) => `<em>${esc(t)}</em>`)
            .replace(/^#{1,6}\s+(.+)/gm, (_, t) => `<h3>${esc(t)}</h3>`)
            .replace(/\n/g, "<br>");
    }
}

/* ===== Timer ===== */
class Timer {
    #bus; #startTime = 0; #questionStart = 0; #accumulated = []; #currentIdx = 0; #running = false; #rafId = null;
    constructor(bus) { this.#bus = bus; }
    start() { if (this.#running) return; const now = performance.now(); this.#startTime = now; this.#questionStart = now; this.#running = true; this.#tick(); }
    stop() { if (!this.#running) return; this.#accrue(this.#currentIdx); this.#running = false; if (this.#rafId) { cancelAnimationFrame(this.#rafId); this.#rafId = null; } }
    reset() { this.stop(); this.#accumulated = []; this.#startTime = 0; this.#questionStart = 0; this.#currentIdx = 0; }
    switchQuestion(from, to) { if (!this.#running || from === to) return; this.#accrue(from); this.#currentIdx = to; this.#questionStart = performance.now(); }
    #accrue(idx) { const elapsed = performance.now() - this.#questionStart; this.#accumulated[idx] = (this.#accumulated[idx] || 0) + elapsed; this.#questionStart = performance.now(); }
    #tick() { if (!this.#running) return; const now = performance.now(); const qTime = (this.#accumulated[this.#currentIdx] || 0) + (now - this.#questionStart); this.#bus.emit("timer:tick", { questionTime: qTime, totalTime: now - this.#startTime }); this.#rafId = requestAnimationFrame(() => this.#tick()); }
    getQuestionTime(idx) { if (idx === this.#currentIdx && this.#running) return (this.#accumulated[idx] || 0) + (performance.now() - this.#questionStart); return this.#accumulated[idx] || 0; }
    getTotalTime() { return this.#running ? performance.now() - this.#startTime : 0; }
}

/* ===== Storage ===== */
const DEFAULTS = Object.freeze({ autoNext: true, autoDelay: 0.5, showHistory: true, hideMastered: false });
class StorageAdapter {
    /* Storage write failures (private mode, quota) are surfaced via onPersistError
       so the UI can notify the user — never silently swallow (Nielsen error prevention). */
    static onPersistError = null;
    static #g(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
    static #s(k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); }
        catch (e) { if (typeof this.onPersistError === "function") this.onPersistError(k, e); }
    }
    static getHistory() { try { const raw = localStorage.getItem("quiz_history"); return raw ? JSON.parse(raw).filter(e => e?.date && typeof e.score === "number").slice(0, 10) : []; } catch { return []; } }
    static saveHistory(h) { this.#s("quiz_history", h.slice(0, 10)); }
    static getSettings() { return { ...DEFAULTS, ...this.#g("quiz_settings", DEFAULTS) }; }
    static saveSettings(s) { this.#s("quiz_settings", s); }
    static getTheme() { try { return localStorage.getItem("quiz_theme"); } catch { return null; } }
    static saveTheme(t) { try { localStorage.setItem("quiz_theme", t); } catch (e) { if (typeof this.onPersistError === "function") this.onPersistError("quiz_theme", e); } }
    static getMastered() { try { const raw = localStorage.getItem("quiz_mastered"); return raw ? JSON.parse(raw) : []; } catch { return []; } }
    static saveMastered(m) { this.#s("quiz_mastered", m); }
    static toggleMastered(text) { const list = this.getMastered(); const h = hashStr(text); const idx = list.indexOf(h); idx > -1 ? list.splice(idx, 1) : list.push(h); this.saveMastered(list); return idx === -1; }
    static isMastered(text) { return this.getMastered().includes(hashStr(text)); }
}

/* ===== Question Parser ===== */
class QuestionParser {
    errors = [];
    parseMarkdown(text, fileName = "") {
        const questions = []; let section = null, cur = null;
        const detectType = s => { s = s.toLowerCase(); if (s.includes("单选") || s.includes("a1") || s.includes("a2")) return "single"; if (s.includes("多选") || s.includes("x1") || s.includes("x2")) return "multiple"; if (s.includes("判断")) return "judgment"; return null; };
        const commit = () => { if (!cur) return; if (cur.options.length && cur.answer) { cur.type ??= cur.answer.length > 1 ? "multiple" : section ?? "single"; questions.push(cur); } else if (!cur.answer) { this.errors.push({ file: fileName, line: cur.text.slice(0, 30), reason: "缺少答案" }); } cur = null; };
        const RE = { heading: /^#+\s*(?:[一二三四五六七八九十]+、\s*)?(单选题|多选题|判断题|A[12]型题|X[12]型题)/i, secBreak: /^#+\s+[一二三四五六七八九十]+、/, qStart: /^(?:### \d+[.．]\s*|\[Q\]\s*)(.*)/, optBr: /^\[([A-E])\]\s*(.*)/, optDot: /^([A-E])[.．、]\s*(.*)/, answer: /^(?:\[T\]|\*\*答案[：:]\s*\*\*)\s*(.*)/, explain: /^\*\*解析[：:]\s*\*\*\s*(.*)/ };
        for (const raw of text.split(/\r?\n/)) {
            const line = raw.trim(); if (!line) continue; let m;
            if      (m = line.match(RE.heading))  { commit(); section = detectType(m[1]) ?? section; }
            else if (RE.secBreak.test(line))      { commit(); }
            else if (m = line.match(RE.qStart))   { commit(); cur = { type: section, text: m[1].trim(), options: [], answer: "", explanation: "" }; }
            else if (cur && (m = line.match(RE.optBr)))   { cur.options.push({ key: m[1], text: m[2].trim() }); }
            else if (cur && (m = line.match(RE.optDot)))  { cur.options.push({ key: m[1], text: m[2].trim() }); }
            else if (cur && (m = line.match(RE.answer)))  { cur.answer = m[1].trim(); cur.type ??= cur.answer.length > 1 ? "multiple" : "single"; }
            else if (cur && (m = line.match(RE.explain))) { cur.explanation = m[1].trim(); }
        }
        commit(); return questions;
    }
    async loadFiles(files) { this.errors = []; const all = []; for (const file of files) { try { const text = await file.text(); const qs = this.parseMarkdown(text, file.name); if (!qs.length) this.errors.push({ file: file.name, error: "无有效题目" }); all.push(...qs); } catch (e) { this.errors.push({ file: file.name, error: e.message }); } } return { questions: all, errors: this.errors }; }
}

/* ===== Quiz State ===== */
class QuizState {
    #questions; #map = new Map();
    constructor(qs) { this.#questions = qs; qs.forEach((_, i) => this.#map.set(i, { selections: [], submitted: false, marked: false })); }
    get(i) { return this.#map.get(i); }
    select(i, key, multi = false) { const s = this.get(i); if (!multi) s.selections = [key]; else { const p = s.selections.indexOf(key); p > -1 ? s.selections.splice(p, 1) : s.selections.push(key); } }
    submitMulti(i) { this.get(i).submitted = true; }
    toggleMark(i) { this.get(i).marked = !this.get(i).marked; }
    isAnswered(i) { const s = this.get(i), q = this.#questions[i]; return q.type === "multiple" ? s.submitted && s.selections.length > 0 : s.selections.length > 0; }
    isErrorAnswered(i) { return this.isAnswered(i) && !this.isCorrect(i); }
    isCorrect(i) { const q = this.#questions[i], s = this.get(i); if (!this.isAnswered(i)) return false; if (q.type !== "multiple") return s.selections[0] === q.answer; return [...s.selections].sort().join("") === [...q.answer.replace(/\s/g, "")].sort().join(""); }
    reset() { this.#questions.forEach((_, i) => this.#map.set(i, { selections: [], submitted: false, marked: false })); }
}

/* ===== Components ===== */

class OptionRenderer {
    #container; #bus;
    constructor(container, bus) { this.#container = container; this.#bus = bus; bus.on("question:render", ({ question, state }) => this.#render(question, state)); bus.on("feedback:show", ({ question, state }) => this.#applyFeedback(question, state)); bus.on("feedback:hide", () => this.#clearFeedback()); }
    #render(q, state) {
        let html = `<div class="question-title">${esc(q.text)}${q.type === "multiple" ? ' <small>(多选)</small>' : q.type === "judgment" ? ' <small>(判断)</small>' : ""}</div><div class="options">`;
        q.options.forEach(opt => { const sel = state.selections.includes(opt.key); const dis = q.type === "multiple" && state.submitted ? " disabled" : ""; html += `<div class="option${sel ? " selected" : ""}${dis}" data-key="${esc(opt.key)}" role="button" tabindex="0" aria-pressed="${sel}"><span>${esc(opt.key)}. ${esc(opt.text)}</span></div>`; });
        html += "</div>";
        if (q.type === "multiple" && !state.submitted) html += `<div class="multi-submit-bar"><button id="multiSubmitBtn" class="btn btn-sm" ${state.selections.length ? "" : "disabled"} aria-label="提交多选题答案">提交答案</button></div>`;
        this.#container.innerHTML = html;
        this.#container.querySelectorAll(".option:not(.disabled)").forEach(el => { el.addEventListener("click", () => this.#bus.emit("option:clicked", { key: el.dataset.key, isMulti: q.type === "multiple" })); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } }); });
        const mb = this.#container.querySelector("#multiSubmitBtn"); if (mb) mb.addEventListener("click", () => this.#bus.emit("multi:submit"));
    }
    #applyFeedback(q, state) { this.#container.querySelectorAll(".option").forEach(el => { el.classList.remove("correct", "incorrect"); if (q.answer.includes(el.dataset.key)) el.classList.add("correct"); else if (state.selections.includes(el.dataset.key)) el.classList.add("incorrect"); el.classList.add("disabled"); }); }
    #clearFeedback() { this.#container.querySelectorAll(".option").forEach(el => el.classList.remove("correct", "incorrect", "disabled")); }
}

class FeedbackPanel {
    #container; #bus;
    constructor(container, bus) { this.#container = container; this.#bus = bus; bus.on("feedback:show", ({ question, state, correct }) => this.show(question, state, correct)); bus.on("feedback:hide", () => this.hide()); }
    show(q, state, correct) {
        const icon = correct
            ? '<svg class="icon-sm" aria-hidden="true"><use href="#icon-check"/></svg>'
            : '<svg class="icon-sm" aria-hidden="true"><use href="#icon-cross"/></svg>';
        let html = `<div class="answer-feedback ${correct ? "correct" : "incorrect"}"><div class="answer-feedback-header">${icon} <span>${correct ? "正确" : "错误"}</span></div>`;
        if (!correct) { const us = state.selections.join(", ") || "未作答"; html += `<div class="answer-feedback-content"><div>您的答案: ${esc(us)}</div><div>正确答案: ${esc(q.answer)}</div>${q.explanation ? `<div class="explanation-content">${MarkdownParser.parse(q.explanation)}</div>` : ""}</div>`; }
        html += "</div>";
        this.#container.innerHTML = html;
        this.#container.classList.remove("hidden");
    }
    hide() { this.#container.classList.add("hidden"); this.#container.innerHTML = ""; }
}

class NavigationBar {
    #container; #bus; #btns = [];
    constructor(container, bus) { this.#container = container; this.#bus = bus; bus.on("nav:build", ({ total, quizState, masteredSet }) => this.#build(total, quizState, masteredSet)); bus.on("nav:updateStyles", ({ currentIdx, quizState, mode, masteredSet }) => this.#updateStyles(currentIdx, quizState, mode, masteredSet)); }
    #build(total, quizState, masteredSet = new Set()) {
        this.#container.replaceChildren();
        this.#btns = Array.from({ length: total }, (_, i) => {
            const btn = document.createElement("button");
            btn.className = "question-nav-btn"; btn.type = "button"; btn.textContent = i + 1;
            btn.setAttribute("aria-label", `题目 ${i + 1}`);
            if (masteredSet.has(i)) btn.classList.add("mastered");
            btn.addEventListener("click", () => { this.#bus.emit("nav:clicked", i); this.#closeOverlay(); });
            this.#container.appendChild(btn); return btn;
        });
        this.#updateStyles(0, quizState, "practice", masteredSet);
    }
    #closeOverlay() {
        const overlay = document.getElementById("navOverlay");
        if (overlay && typeof overlay.close === "function" && overlay.open) overlay.close();
    }
    #updateStyles(currentIdx, quizState, mode, masteredSet = new Set()) {
        this.#btns.forEach((btn, i) => {
            btn.className = "question-nav-btn";
            btn.classList.toggle("current", i === currentIdx);
            btn.setAttribute("aria-current", i === currentIdx ? "true" : "false");
            if (quizState.isAnswered(i)) btn.classList.add(quizState.isErrorAnswered(i) && mode !== "exam" ? "error-answered" : "answered");
            if (quizState.get(i)?.marked) btn.classList.add("marked");
            if (masteredSet.has(i)) btn.classList.add("mastered");
        });
    }
}

class ProgressBarComponent {
    #el; constructor(el, bus) { this.#el = el; bus.on("progress:update", ({ answered, total }) => { const pct = total > 0 ? (answered / total) * 100 : 0; this.#el.style.width = `${pct}%`; const bar = this.#el.closest(".progress"); if (bar) { bar.setAttribute("aria-valuenow", String(Math.round(pct))); bar.setAttribute("aria-valuetext", `${answered}/${total} 题已完成`); } }); }
}

class StatsPanel {
    #els; constructor(els, bus) { this.#els = els; bus.on("stats:update", ({ correct, incorrect, unanswered }) => { if (this.#els.correct) this.#els.correct.textContent = correct; if (this.#els.incorrect) this.#els.incorrect.textContent = incorrect; if (this.#els.unanswered) this.#els.unanswered.textContent = unanswered; }); }
}

class TimerDisplay {
    #els; constructor(els, bus) { this.#els = els; bus.on("timer:tick", ({ questionTime, totalTime }) => { if (this.#els.cur) this.#els.cur.textContent = fmtTime(questionTime); if (this.#els.total) this.#els.total.textContent = fmtTime(totalTime); }); }
}

class ResultPanel {
    #els; constructor(els, bus) { this.#els = els; bus.on("result:show", data => this.show(data)); }
    show({ correct, incorrect, unanswered, total, totalTime, mode }) { const avg = (total - unanswered) > 0 ? totalTime / (total - unanswered) : 0; const pct = total > 0 ? (correct / total) * 100 : 0; if (this.#els.scoreValue) this.#els.scoreValue.textContent = correct; if (this.#els.totalScore) this.#els.totalScore.textContent = total; if (this.#els.resCorrect) this.#els.resCorrect.textContent = correct; if (this.#els.resIncorrect) this.#els.resIncorrect.textContent = incorrect; if (this.#els.resUnanswered) this.#els.resUnanswered.textContent = unanswered; if (this.#els.resultTotalTime) this.#els.resultTotalTime.textContent = fmtTime(totalTime); if (this.#els.avgTime) this.#els.avgTime.textContent = fmtTime(avg); if (this.#els.resultMsg) this.#els.resultMsg.textContent = pct >= 90 ? "优秀！" : pct >= 70 ? "良好" : "继续加油"; }
}

class HistoryPanel {
    #container; #bus; #history;
    constructor(container, bus) { this.#container = container; this.#bus = bus; this.#history = StorageAdapter.getHistory(); bus.on("history:updated", h => { this.#history = h; this.render(); }); this.render(); }
    render() {
        this.#container.replaceChildren();
        this.#history.forEach(e => {
            const div = document.createElement("div");
            div.className = "history-item"; div.setAttribute("role", "listitem");
            const time = document.createElement("time");
            if (e.isoDate) time.setAttribute("datetime", e.isoDate);
            time.textContent = e.date;
            div.append(time, ` | ${e.mode === "exam" ? "考试" : "刷题"} | ${e.score}/${e.total} | ${fmtTime(e.totalTime || 0)} | ${e.percentage ?? 0}%`);
            this.#container.appendChild(div);
        });
    }
}

class ThemeManager {
    #buttons; #bus;
    constructor(buttons, bus) { this.#buttons = buttons; this.#bus = bus; this.#init(); }
    #init() {
        const saved = StorageAdapter.getTheme() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        this.setTheme(saved, false);
        const arr = Array.from(this.#buttons);
        this.#buttons.forEach(btn => {
            btn.addEventListener("click", () => this.setTheme(btn.dataset.themeValue));
            btn.addEventListener("keydown", e => {
                const idx = arr.indexOf(btn);
                let nextIdx = null;
                if (e.key === "ArrowRight" || e.key === "ArrowDown") nextIdx = (idx + 1) % arr.length;
                else if (e.key === "ArrowLeft" || e.key === "ArrowUp") nextIdx = (idx - 1 + arr.length) % arr.length;
                if (nextIdx !== null) { e.preventDefault(); arr[nextIdx].focus(); this.setTheme(arr[nextIdx].dataset.themeValue); }
            });
        });
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { if (!StorageAdapter.getTheme()) this.setTheme(e.matches ? "dark" : "light"); });
    }
    setTheme(theme, emit = true) {
        document.documentElement.setAttribute("data-theme", theme);
        StorageAdapter.saveTheme(theme);
        this.#buttons.forEach(btn => {
            const isActive = btn.dataset.themeValue === theme;
            btn.classList.toggle("selected", isActive);
            btn.setAttribute("aria-checked", String(isActive));
            btn.tabIndex = isActive ? 0 : -1; // roving tabindex for ARIA radiogroup
        });
        if (emit) this.#bus.emit("theme:changed", theme);
    }
}

class ToastComponent {
    #el; #tid = null;
    constructor(el, bus) { this.#el = el; bus.on("toast:show", ({ message, isError, duration }) => this.show(message, isError, duration)); }
    show(msg, isError = false, dur = 3000) { if (this.#tid) clearTimeout(this.#tid); this.#el.textContent = msg; this.#el.className = `snackbar show${isError ? " error" : ""}`; this.#tid = setTimeout(() => { this.#el.classList.remove("show"); this.#tid = null; }, dur); }
}

/* ===== Quiz Controller ===== */
class QuizController {
    #bus = new EventBus(); #quizState = null; #currentIdx = 0; #mode = "practice";
    #questions = []; #masteredSet = new Set(); #settings; #history;
    #justAnswered = false; #autoNextId = null;
    #parser = new QuestionParser(); #timer; #els;

    constructor() {
        this.#settings = StorageAdapter.getSettings();
        this.#history = StorageAdapter.getHistory();
        this.#timer = new Timer(this.#bus);
        this.#collectDOMRefs();
        this.#initComponents();
        this.#bindEvents();
        this.#applySettings();
        new ThemeManager(this.#els.themeOptions, this.#bus);
        // Surface localStorage persistence failures (Nielsen error prevention).
        StorageAdapter.onPersistError = (k, _e) => {
            this.#bus.emit("toast:show", { message: `设置未能持久化（存储不可用或已满）`, isError: true });
            console.warn(`[Storage] persist failed for "${k}"`);
        };
    }

    #collectDOMRefs() {
        const $ = id => document.getElementById(id);
        this.#els = {
            menuPanel: $("menuPanel"),
            themeOptions: document.querySelectorAll(".theme-option"),
            fileInput: $("fileInput"), fileDropZone: $("fileDropZone"),
            fileList: $("fileList"), fileStatus: $("fileStatus"),
            modeSection: $("modeSection"), modeCards: document.querySelectorAll(".mode-card"),
            startBtn: $("startQuizBtn"),
            autoNextToggle: $("autoNextToggle"), autoNextDelay: $("autoNextDelay"),
            showHistoryToggle: $("showHistoryToggle"), hideMasteredToggle: $("hideMasteredToggle"),
            quizSection: $("quizSection"), resultSection: $("resultSection"),
            questionContainer: $("questionContainer"), feedback: $("answerFeedback"),
            prevBtn: $("prevBtn"), nextBtn: $("nextBtn"), markBtn: $("markBtn"),
            masterBtn: $("masterBtn"),
            restartBtn: $("restartBtn"), reviewBtn: $("reviewBtn"),
            wrongContainer: $("wrongContainer"), exportBtn: $("exportBtn"),
            exportPanel: $("exportPanel"), exportLinks: $("exportLinks"),
            copyExportBtn: $("copyExportBtn"), closeExportBtn: $("closeExportBtn"),
            historyPanel: $("historyPanel"), historyList: $("historyList"),
            snackbar: $("snackbar"),
            curTime: $("curTime"), totalTime: $("totalTime"), progressBar: $("progressBar"),
            currentQ: $("currentQ"), totalQ: $("totalQ"),
            correctCount: $("correctCount"), incorrectCount: $("incorrectCount"), unansweredCount: $("unansweredCount"),
            scoreValue: $("scoreValue"), totalScore: $("totalScore"),
            resultTotalTime: $("resultTotalTime"), avgTime: $("avgTime"),
            resCorrect: $("resCorrect"), resIncorrect: $("resIncorrect"), resUnanswered: $("resUnanswered"),
            resultMsg: $("resultMsg"),
            touchSwipeZone: $("touchSwipeZone"), questionSlideWrap: $("questionSlideWrap"),
            swipeIndicatorLeft: document.querySelector(".swipe-indicator.left"),
            swipeIndicatorRight: document.querySelector(".swipe-indicator.right"),
            markBadge: $("markBadge"),
            navFab: $("navFab"), navOverlay: $("navOverlay"),
            navOverlayClose: $("navOverlayClose"), navSubmitBtn: $("navSubmitBtn"),
            questionNav: $("questionNav"),
        };
    }

    #initComponents() {
        new OptionRenderer(this.#els.questionContainer, this.#bus);
        new FeedbackPanel(this.#els.feedback, this.#bus);
        new NavigationBar(this.#els.questionNav, this.#bus);
        new ProgressBarComponent(this.#els.progressBar, this.#bus);
        new StatsPanel({ correct: this.#els.correctCount, incorrect: this.#els.incorrectCount, unanswered: this.#els.unansweredCount }, this.#bus);
        new TimerDisplay({ cur: this.#els.curTime, total: this.#els.totalTime }, this.#bus);
        new ResultPanel({ scoreValue: this.#els.scoreValue, totalScore: this.#els.totalScore, resCorrect: this.#els.resCorrect, resIncorrect: this.#els.resIncorrect, resUnanswered: this.#els.resUnanswered, resultTotalTime: this.#els.resultTotalTime, avgTime: this.#els.avgTime, resultMsg: this.#els.resultMsg }, this.#bus);
        new HistoryPanel(this.#els.historyList, this.#bus);
        new ToastComponent(this.#els.snackbar, this.#bus);
    }

    #bindEvents() {
        // File loading is initiated by selection (auto-load) and drag-drop.
        // The native <label for="fileInput"> handles click activation.
        this.#els.startBtn.addEventListener("click", () => this.#start());
        this.#els.fileInput.addEventListener("change", () => this.#onFileSelected());
        this.#els.prevBtn.addEventListener("click", () => this.#navigate(-1));
        this.#els.nextBtn.addEventListener("click", () => this.#navigate(1));
        this.#els.markBtn.addEventListener("click", () => this.#toggleMark());
        this.#els.masterBtn?.addEventListener("click", () => this.#toggleMaster());
        this.#els.navSubmitBtn?.addEventListener("click", () => this.#finish());
        this.#els.restartBtn.addEventListener("click", () => this.#restart());
        this.#els.reviewBtn.addEventListener("click", () => this.#showWrong());
        this.#els.exportBtn.addEventListener("click", () => this.#exportWrong());
        this.#els.copyExportBtn.addEventListener("click", () => this.#copyExport());
        this.#els.closeExportBtn.addEventListener("click", () => this.#els.exportPanel.classList.add("hidden"));

        this.#els.autoNextToggle.addEventListener("change", e => { this.#settings.autoNext = e.target.checked; StorageAdapter.saveSettings(this.#settings); });
        this.#els.autoNextDelay.addEventListener("change", e => { this.#settings.autoDelay = +e.target.value; StorageAdapter.saveSettings(this.#settings); });
        this.#els.showHistoryToggle.addEventListener("change", e => { this.#settings.showHistory = e.target.checked; this.#els.historyPanel.style.display = e.target.checked ? "" : "none"; StorageAdapter.saveSettings(this.#settings); });
        this.#els.hideMasteredToggle?.addEventListener("change", e => { this.#settings.hideMastered = e.target.checked; StorageAdapter.saveSettings(this.#settings); this.#bus.emit("toast:show", { message: e.target.checked ? "已启用隐藏已掌握题目，下次加载生效" : "已禁用隐藏已掌握题目" }); });

        this.#initModeCards(); // radiogroup pattern: roving tabindex + arrow keys + Enter/Space
        document.addEventListener("keydown", e => this.#handleKey(e));

        this.#bus.on("option:clicked", ({ key, isMulti }) => { if (!this.#quizState) return; this.#quizState.select(this.#currentIdx, key, isMulti); this.#justAnswered = true; this.#refresh(); });
        this.#bus.on("multi:submit", () => { if (!this.#quizState) return; this.#quizState.submitMulti(this.#currentIdx); this.#justAnswered = true; this.#refresh(); });
        this.#bus.on("nav:clicked", idx => { this.#justAnswered = false; this.#showQuestion(idx); });

        // Floating nav — <dialog> provides native ESC + focus trap; we still handle
        // backdrop click & explicit close buttons.
        this.#els.navFab?.addEventListener("click", () => this.#toggleNavOverlay());
        this.#els.navOverlayClose?.addEventListener("click", () => this.#closeNavOverlay());
        this.#els.navOverlay?.addEventListener("click", e => { if (e.target === this.#els.navOverlay) this.#closeNavOverlay(); });
        this.#els.navOverlay?.addEventListener("close", () => { /* state already handled by close() */ });

        this.#initFileDrop();
        this.#initTouchSwipe();
    }

    /* ARIA radiogroup pattern for mode selection: Enter/Space activates, arrow
       keys move focus + selection, roving tabindex keeps a single tab stop. */
    #initModeCards() {
        const arr = Array.from(this.#els.modeCards);
        arr.forEach(card => {
            card.addEventListener("click", () => this.#selectMode(card.dataset.mode));
            card.addEventListener("keydown", e => {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.#selectMode(card.dataset.mode); return; }
                const idx = arr.indexOf(card);
                let nextIdx = null;
                if (e.key === "ArrowRight" || e.key === "ArrowDown") nextIdx = (idx + 1) % arr.length;
                else if (e.key === "ArrowLeft" || e.key === "ArrowUp") nextIdx = (idx - 1 + arr.length) % arr.length;
                if (nextIdx !== null) { e.preventDefault(); arr[nextIdx].focus(); this.#selectMode(arr[nextIdx].dataset.mode); }
            });
        });
    }

    /* Skeleton screen — shown in the question area during async parse/reload
       (Nielsen “system state visible”, reduces perceived latency). */
    #showSkeleton() {
        this.#els.questionContainer.innerHTML =
            '<div class="skeleton skeleton-title"></div>' +
            '<div class="skeleton skeleton-option"></div>'.repeat(3);
        this.#els.feedback.classList.add("hidden");
        this.#els.feedback.innerHTML = "";
    }

    #toggleNavOverlay() {
        const ov = this.#els.navOverlay;
        if (!(ov && typeof ov.showModal === "function")) return;
        if (ov.open) ov.close();
        else {
            try {
                ov.showModal();
                // Explicitly focus the close button so AT users land on an actionable element.
                this.#els.navOverlayClose?.focus();
            } catch (e) {
                console.warn('[Nav] showModal failed:', e);
                this.#bus.emit("toast:show", { message: "无法打开导航窗口", isError: true });
            }
        }
    }

    #closeNavOverlay() {
        const ov = this.#els.navOverlay;
        if (ov && typeof ov.close === "function" && ov.open) {
            ov.close();
            this.#els.navFab?.focus(); // return focus to trigger (Shneiderman control)
        }
    }

    #onFileSelected(files = null) {
        const fl = files ? Array.from(files) : Array.from(this.#els.fileInput.files || []);
        if (!fl.length) { this.#els.fileList.innerHTML = ""; return; }
        const ul = document.createElement("ul"); // <ul> has implicit role=list
        fl.forEach(f => { const li = document.createElement("li"); li.textContent = f.name; ul.appendChild(li); });
        this.#els.fileList.replaceChildren(ul);
        // Auto-load (progressive: no manual “load” step → fewer decisions). Catch
        // unexpected rejections and surface them rather than failing silently.
        this.#load(fl).catch(err => this.#bus.emit("toast:show", { message: `加载失败：${err?.message || err}`, isError: true }));
    }

    #initFileDrop() {
        const zone = this.#els.fileDropZone; if (!zone) return;
        const stop = e => { e.preventDefault(); e.stopPropagation(); };
        zone.addEventListener("dragenter", e => { stop(e); zone.classList.add("dragover"); });
        zone.addEventListener("dragover",  e => { stop(e); zone.classList.add("dragover"); });
        zone.addEventListener("dragleave", e => { stop(e); if (e.target === zone) zone.classList.remove("dragover"); });
        zone.addEventListener("drop", e => {
            stop(e); zone.classList.remove("dragover");
            const dt = e.dataTransfer;
            if (dt && dt.files && dt.files.length) {
                // `input.files = dt.files` isn’t supported in Safari; fall back to
                // loading directly from the DataTransfer list.
                try { this.#els.fileInput.files = dt.files; this.#onFileSelected(); }
                catch { this.#onFileSelected(dt.files); }
            }
        });
    }

    #applySettings() {
        this.#els.autoNextToggle.checked = this.#settings.autoNext;
        this.#els.autoNextDelay.value = this.#settings.autoDelay;
        this.#els.showHistoryToggle.checked = this.#settings.showHistory;
        this.#els.hideMasteredToggle.checked = this.#settings.hideMastered;
        this.#els.historyPanel.style.display = this.#settings.showHistory ? "" : "none";
    }

    async #load(files = null) {
        this.#timer.stop(); this.#timer.reset();
        const fl = files ? Array.from(files) : Array.from(this.#els.fileInput.files || []);
        if (!fl.length) { this.#bus.emit("toast:show", { message: "请选择文件", isError: true }); return; }
        // System state visible (Nielsen): mark busy during async parse + skeleton.
        this.#els.fileDropZone?.setAttribute("aria-busy", "true");
        this.#els.fileStatus.setAttribute("aria-busy", "true");
        this.#els.fileStatus.innerText = "正在解析题库…";
        // Show skeleton if quiz area is already visible (reload scenario).
        if (!this.#els.quizSection.classList.contains("hidden")) this.#showSkeleton();
        try {
            const { questions, errors } = await this.#parser.loadFiles(fl);
            if (errors.length) this.#els.fileStatus.innerText = `解析错误: ${errors.map(e => `${e.file}: ${e.error || e.reason}`).join("; ")}`;
            if (!questions.length) { this.#bus.emit("toast:show", { message: "无有效题目", isError: true }); return; }
            let filtered = questions;
            if (this.#settings.hideMastered) {
                filtered = questions.filter(q => !StorageAdapter.isMastered(q.text));
                const removed = questions.length - filtered.length;
                if (removed) this.#els.fileStatus.innerText = `共导入 ${questions.length} 题，已过滤 ${removed} 道已掌握题目`;
            }
            this.#questions = filtered;
            this.#quizState = new QuizState(filtered);
            this.#currentIdx = 0;
            this.#computeMasteredSet();
            if (!this.#settings.hideMastered) this.#els.fileStatus.innerText = `成功加载 ${filtered.length} 题`;
            this.#els.modeSection.classList.remove("hidden");
            this.#selectMode("practice");
        } finally {
            this.#els.fileDropZone?.setAttribute("aria-busy", "false");
            this.#els.fileStatus.setAttribute("aria-busy", "false");
        }
    }

    #computeMasteredSet() {
        this.#masteredSet = new Set();
        this.#questions.forEach((q, i) => { if (StorageAdapter.isMastered(q.text)) this.#masteredSet.add(i); });
    }

    #toggleMaster() {
        if (!this.#quizState) return;
        const q = this.#questions[this.#currentIdx];
        const nowMastered = StorageAdapter.toggleMastered(q.text);
        if (nowMastered) this.#masteredSet.add(this.#currentIdx);
        else this.#masteredSet.delete(this.#currentIdx);
        const masterText = this.#els.masterBtn?.querySelector(".btn-text");
        if (masterText) masterText.textContent = nowMastered ? "已掌握 ✓" : "已掌握";
        this.#els.masterBtn.classList.toggle("btn-active", nowMastered);
        this.#els.masterBtn.classList.toggle("btn-ghost", !nowMastered);
        this.#els.masterBtn.setAttribute("aria-pressed", String(nowMastered));
        this.#bus.emit("nav:updateStyles", { currentIdx: this.#currentIdx, quizState: this.#quizState, mode: this.#mode, masteredSet: this.#masteredSet });
        this.#bus.emit("toast:show", { message: nowMastered ? "已标记为掌握，下次加载可隐藏" : "已取消掌握标记" });
    }

    #selectMode(mode) {
        this.#mode = mode;
        const arr = Array.from(this.#els.modeCards);
        arr.forEach(c => {
            const isActive = c.dataset.mode === mode;
            c.classList.toggle("selected", isActive);
            c.setAttribute("aria-checked", String(isActive));
            c.tabIndex = isActive ? 0 : -1;
        });
    }

    #start() {
        if (!this.#quizState) return;
        this.#els.modeSection.classList.add("hidden");
        this.#els.menuPanel.open = false; // <details> native
        this.#els.quizSection.classList.remove("hidden");
        this.#els.navFab?.classList.remove("hidden");
        this.#els.resultSection.classList.add("hidden");
        this.#els.totalQ.textContent = this.#questions.length;
        this.#computeMasteredSet();
        this.#timer.reset(); this.#timer.start();
        this.#bus.emit("nav:build", { total: this.#questions.length, quizState: this.#quizState, masteredSet: this.#masteredSet });
        this.#showQuestion(0);
    }

    #showQuestion(idx) {
        if (!this.#quizState || idx < 0 || idx >= this.#questions.length) return;
        this.#timer.switchQuestion(this.#currentIdx, idx);
        this.#currentIdx = idx;
        const q = this.#questions[idx], s = this.#quizState.get(idx);
        this.#els.currentQ.textContent = idx + 1;
        const markText = this.#els.markBtn.querySelector(".btn-text");
        if (markText) markText.textContent = s.marked ? "已标记" : "标记";
        this.#els.markBtn.setAttribute("aria-label", s.marked ? "取消标记当前题目" : "标记当前题目");
        this.#els.markBtn.setAttribute("aria-pressed", String(s.marked));
        this.#els.markBtn.classList.toggle("btn-active", s.marked);
        this.#els.markBtn.classList.toggle("btn-ghost", !s.marked);
        this.#els.markBadge.classList.toggle("hidden", !s.marked);
        this.#els.prevBtn.disabled = idx === 0;
        this.#els.nextBtn.disabled = idx === this.#questions.length - 1;
        const isMastered = this.#masteredSet.has(idx);
        if (this.#els.masterBtn) {
            const masterText = this.#els.masterBtn.querySelector(".btn-text");
            if (masterText) masterText.textContent = "已掌握";
            this.#els.masterBtn.classList.toggle("btn-active", isMastered);
            this.#els.masterBtn.classList.toggle("btn-ghost", !isMastered);
            this.#els.masterBtn.setAttribute("aria-pressed", String(isMastered));
        }

        this.#bus.emit("question:render", { question: q, state: s });
        if (this.#mode === "practice" && this.#quizState.isAnswered(idx)) {
            this.#bus.emit("feedback:show", { question: q, state: s, correct: this.#quizState.isCorrect(idx) });
        } else { this.#bus.emit("feedback:hide"); }
        this.#bus.emit("nav:updateStyles", { currentIdx: idx, quizState: this.#quizState, mode: this.#mode, masteredSet: this.#masteredSet });
        this.#updateStats();
        this.#updateProgress();

        const wasJust = this.#justAnswered;
        this.#justAnswered = false;
        if (this.#autoNextId) { clearTimeout(this.#autoNextId); this.#autoNextId = null; }
        if (wasJust && this.#settings.autoNext && this.#quizState.isAnswered(idx) && idx < this.#questions.length - 1) {
            this.#autoNextId = setTimeout(() => { this.#navigate(1); this.#autoNextId = null; }, this.#settings.autoDelay * 1000);
        }
    }

    #refresh() { this.#showQuestion(this.#currentIdx); }

    #navigate(dir) { this.#justAnswered = false; if (this.#autoNextId) { clearTimeout(this.#autoNextId); this.#autoNextId = null; } this.#showQuestion(this.#currentIdx + dir); }

    #toggleMark() {
        if (!this.#quizState) return;
        this.#quizState.toggleMark(this.#currentIdx);
        this.#bus.emit("nav:updateStyles", { currentIdx: this.#currentIdx, quizState: this.#quizState, mode: this.#mode, masteredSet: this.#masteredSet });
        const marked = this.#quizState.get(this.#currentIdx).marked;
        const markText = this.#els.markBtn.querySelector(".btn-text");
        if (markText) markText.textContent = marked ? "已标记" : "标记";
        this.#els.markBtn.setAttribute("aria-label", marked ? "取消标记当前题目" : "标记当前题目");
        this.#els.markBtn.setAttribute("aria-pressed", String(marked));
        this.#els.markBtn.classList.toggle("btn-active", marked);
        this.#els.markBtn.classList.toggle("btn-ghost", !marked);
        this.#els.markBadge.classList.toggle("hidden", !marked);
    }

    #updateStats() {
        if (!this.#quizState) return;
        let c = 0, i = 0, u = 0;
        this.#questions.forEach((_, idx) => { if (!this.#quizState.isAnswered(idx)) u++; else if (this.#quizState.isCorrect(idx)) c++; else i++; });
        this.#bus.emit("stats:update", { correct: c, incorrect: i, unanswered: u });
    }

    #updateProgress() { if (!this.#quizState) return; const answered = this.#questions.filter((_, i) => this.#quizState.isAnswered(i)).length; this.#bus.emit("progress:update", { answered, total: this.#questions.length }); }

    #finish() { this.#timer.stop(); if (this.#autoNextId) { clearTimeout(this.#autoNextId); this.#autoNextId = null; } this.#updateStats(); this.#saveHistory(); this.#showResults(); }

    #countStats() { let c = 0, i = 0, u = 0; this.#questions.forEach((_, idx) => { if (!this.#quizState.isAnswered(idx)) u++; else if (this.#quizState.isCorrect(idx)) c++; else i++; }); return { correct: c, incorrect: i, unanswered: u }; }

    #showResults() {
        if (!this.#quizState) return;
        this.#els.quizSection.classList.add("hidden");
        this.#els.navFab?.classList.add("hidden");
        this.#closeNavOverlay(); // <dialog> close
        this.#els.resultSection.classList.remove("hidden");
        const { correct, incorrect, unanswered } = this.#countStats();
        this.#bus.emit("result:show", { correct, incorrect, unanswered, total: this.#questions.length, totalTime: this.#timer.getTotalTime(), mode: this.#mode });
        if (this.#mode === "exam") this.#showWrong();
    }

    #saveHistory() {
        if (!this.#quizState) return;
        const now = new Date();
        const correct = this.#questions.filter((_, i) => this.#quizState.isCorrect(i)).length;
        this.#history.unshift({ date: now.toLocaleString(), isoDate: now.toISOString(), score: correct, total: this.#questions.length, percentage: Math.round((correct / this.#questions.length) * 100), mode: this.#mode, totalTime: this.#timer.getTotalTime() });
        if (this.#history.length > 10) this.#history = this.#history.slice(0, 10);
        StorageAdapter.saveHistory(this.#history);
        this.#bus.emit("history:updated", this.#history);
    }

    #restart() {
        if (!this.#quizState) return;
        this.#quizState.reset(); this.#currentIdx = 0; this.#justAnswered = false;
        if (this.#autoNextId) { clearTimeout(this.#autoNextId); this.#autoNextId = null; }
        this.#timer.reset(); this.#timer.start();
        this.#els.quizSection.classList.remove("hidden");
        this.#els.navFab?.classList.remove("hidden");
        this.#closeNavOverlay();
        this.#els.resultSection.classList.add("hidden");
        this.#els.menuPanel.open = true; // <details> open
        this.#computeMasteredSet();
        this.#bus.emit("nav:build", { total: this.#questions.length, quizState: this.#quizState, masteredSet: this.#masteredSet });
        this.#showQuestion(0);
    }

    #showWrong() {
        if (!this.#quizState) return;
        this.#els.wrongContainer.innerHTML = '<div class="wrong-section-title">错题回顾</div>';
        const wrong = []; this.#questions.forEach((q, i) => { if (!this.#quizState.isCorrect(i)) wrong.push({ q, i }); });
        if (!wrong.length) { this.#els.wrongContainer.innerHTML += '<div class="wrong-all-correct">✓ 全部正确！</div>'; return; }
        const totalW = wrong.length;
        const summary = document.createElement("p"); summary.className = "wrong-summary"; summary.textContent = `共 ${totalW} 道错题，占总题数 ${this.#questions.length} 的 ${Math.round((totalW / this.#questions.length) * 100)}%`;
        this.#els.wrongContainer.appendChild(summary);
        wrong.forEach(({ q, i }) => {
            const s = this.#quizState.get(i);
            const card = document.createElement("div"); card.className = "wrong-card";
            const header = document.createElement("div"); header.className = "wrong-card-header"; header.innerHTML = `<span>#${i + 1}</span><span class="badge">错题</span>`; card.appendChild(header);
            const title = document.createElement("div"); title.className = "wrong-card-title"; title.textContent = q.text; card.appendChild(title);
            const opts = document.createElement("div"); opts.className = "wrong-card-options"; q.options.forEach(o => { const span = document.createElement("span"); span.className = "wrong-card-option"; if (q.answer.includes(o.key)) span.classList.add("correct-answer"); span.textContent = `${o.key}. ${o.text}`; opts.appendChild(span); }); card.appendChild(opts);
            const row = document.createElement("div"); row.className = "wrong-card-answer-row"; const us = s.selections.join(", ") || "未作答"; row.innerHTML = `<span>你的答案: <span class="wrong-card-user-ans">${esc(us)}</span></span><span>正确答案: <span class="wrong-card-correct-ans">${esc(q.answer)}</span></span>`; card.appendChild(row);
            if (q.explanation) { const exp = document.createElement("div"); exp.className = "wrong-card-explanation"; exp.innerHTML = `<strong>解析：</strong>${MarkdownParser.parse(q.explanation)}`; card.appendChild(exp); }
            this.#els.wrongContainer.appendChild(card);
        });
    }

    #exportWrong() {
        if (!this.#quizState) return; const wrong = []; this.#questions.forEach((q, i) => { if (!this.#quizState.isCorrect(i)) wrong.push({ q, i }); }); if (!wrong.length) { this.#bus.emit("toast:show", { message: "没有错题", isError: true }); return; } this.#els.exportLinks.value = wrong.map(({ q, i }) => `[[题库#${i + 1}. ${esc(q.text).substring(0, 30)}]]`).join("\n"); this.#els.exportPanel.classList.remove("hidden");
    }
    async #copyExport() { try { await navigator.clipboard.writeText(this.#els.exportLinks.value); this.#bus.emit("toast:show", { message: "已复制到剪贴板" }); } catch { this.#bus.emit("toast:show", { message: "复制失败，请手动复制", isError: true }); } }

    #handleKey(e) {
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || document.activeElement?.isContentEditable) return;
        if (!this.#quizState) return;
        const q = this.#questions[this.#currentIdx];
        if (e.key >= "1" && e.key <= "5") { const optIdx = +e.key - 1; if (q.options[optIdx]) { this.#quizState.select(this.#currentIdx, q.options[optIdx].key, q.type === "multiple"); this.#justAnswered = true; this.#refresh(); } }
        else if (e.key === "ArrowLeft")  { e.preventDefault(); this.#navigate(-1); }
        else if (e.key === "ArrowRight") { e.preventDefault(); this.#navigate(1); }
        // m = toggleMark (markBtn), Shift+m = toggleMaster (masterBtn). Fixes the bug
        // where both m and M previously triggered #toggleMark regardless.
        else if (e.key === "m" && !e.shiftKey) { e.preventDefault(); this.#toggleMark(); }
        else if ((e.key === "M" || (e.key === "m" && e.shiftKey))) { e.preventDefault(); this.#toggleMaster(); }
        else if (e.key === "Enter") { if (q.type === "multiple" && this.#mode === "practice" && !this.#quizState.get(this.#currentIdx).submitted) { this.#quizState.submitMulti(this.#currentIdx); this.#justAnswered = true; this.#refresh(); } else if (this.#currentIdx < this.#questions.length - 1) this.#navigate(1); }
        else if (e.key === "Escape") { this.#closeNavOverlay(); }
    }

    #initTouchSwipe() {
        const zone = this.#els.touchSwipeZone, wrap = this.#els.questionSlideWrap;
        const li = this.#els.swipeIndicatorLeft, ri = this.#els.swipeIndicatorRight;
        if (!zone) return;
        let startX = 0, startY = 0, swiping = false;
        const THRESHOLD = 60, VRATIO = 1.2;
        const clear = () => { swiping = false; zone.classList.remove("swiping"); li?.classList.remove("active", "reach"); ri?.classList.remove("active", "reach"); wrap?.classList.remove("sliding-left", "sliding-right"); };
        zone.addEventListener("touchstart", e => { if (!this.#quizState) return; const t = e.changedTouches[0]; startX = t.clientX; startY = t.clientY; swiping = false; }, { passive: true });
        zone.addEventListener("touchmove", e => { if (!this.#quizState) return; const t = e.changedTouches[0]; const dx = t.clientX - startX, dy = t.clientY - startY; const ax = Math.abs(dx), ay = Math.abs(dy); if (!swiping && ax > 20 && ax > ay * VRATIO) { swiping = true; zone.classList.add("swiping"); } if (swiping) { e.preventDefault(); if (dx < 0) { wrap?.classList.remove("sliding-right"); wrap?.classList.add("sliding-left"); ri?.classList.add("active"); li?.classList.remove("active", "reach"); if (ax >= THRESHOLD) ri?.classList.add("reach"); } else { wrap?.classList.remove("sliding-left"); wrap?.classList.add("sliding-right"); li?.classList.add("active"); ri?.classList.remove("active", "reach"); if (ax >= THRESHOLD) li?.classList.add("reach"); } } }, { passive: false });
        zone.addEventListener("touchend", e => { if (!this.#quizState || !swiping) { clear(); return; } const t = e.changedTouches[0]; const ax = Math.abs(t.clientX - startX); if (ax >= THRESHOLD) { if (t.clientX - startX < 0) { if (this.#currentIdx < this.#questions.length - 1) this.#navigate(1); } else { if (this.#currentIdx > 0) this.#navigate(-1); } } clear(); }, { passive: true });
        zone.addEventListener("touchcancel", clear, { passive: true });
    }
}

/* ===== App Entry ===== */
new QuizController();
</script>
